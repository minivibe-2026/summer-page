<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>여름 명소 큐레이션</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  /* Color */
  --c-primary:#28C96F;
  --c-primary-soft:#EAF8F0;
  --c-ink:#111111;
  --c-gray:#666666;
  --c-line:#EEEEEE;
  --c-bg:#FFFFFF;
  --c-white:#FFFFFF;

  /* Layout */
  --radius-card:20px;
  --radius-capsule:999px;
  --radius-pill:999px;
  --gap-card:20px;
  --max-width:1240px;

  /* Type */
  --font-base: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
    "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth; overflow-x:hidden;}
body{
  margin:0;
  background:var(--c-bg);
  color:var(--c-ink);
  font-family:var(--font-base);
  -webkit-font-smoothing:antialiased;
  word-break:keep-all;
  overflow-wrap:break-word;
  overflow-x:hidden;
}
a{text-decoration:none;color:inherit}
button{font:inherit}
img{max-width:100%}

:is(a,button,.tab):focus-visible{
  outline:2px solid var(--c-primary);
  outline-offset:2px;
  border-radius:8px;
}

/* =========================================================
   HERO — 좌 / 중앙 / 우 3분할
   ========================================================= */
.hero-scale-outer{
  width:100%;
  display:flex;
  justify-content:center;
}
.hero{
  max-width:1240px;
  width:1240px;
  margin:0 auto;
  padding:48px 30px 34px;
  min-height:430px;
  background:#FFFFFF;
  flex:none;
}

.hero::after{
  content:"";
  display:block;
  height:10px;
}

.hero-grid{
  display:grid;
  grid-template-columns:36fr 28fr 36fr;
  gap:34px;
  align-items:center;
}
.hero-col{ display:flex; flex-direction:column; }

/* ---- 좌측: 캐릭터 캡슐 + pill 무리 ---- */
.hero-left{ gap:14px; align-items:flex-start; }
.capsule{
  border-radius:var(--radius-capsule);
  background:var(--c-primary);
  position:relative;
}
.capsule-character{
  width:100%;
  max-width:400px;
  height:205px;
  position:relative;
  overflow:visible;
}
.capsule-character .asset-img{
  position:absolute;
  bottom:-2px;
  left:50%;
  transform:translateX(-50%);
  height:312px;
  width:auto;
  object-fit:contain;
  z-index:2;
}
.hero-sun-deco{
  position:absolute;
  top:-13px;
  right:8%;
  width:clamp(46px,4.8vw,52px);
  height:auto;
  object-fit:contain;
  z-index:3;
  pointer-events:none;
}

.hero-keywords{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:7px 8px;
  width:410px;
  max-width:100%;
  margin-top:8px;
  align-content:flex-start;
}
.pill{
  display:inline-flex;
  align-items:center;
  height:30px;
  padding:0 12px;
  border-radius:var(--radius-pill);
  font-size:11.5px;
  font-weight:600;
  white-space:nowrap;
}
.pill-light{ background:var(--c-white); color:var(--c-ink); border:1px solid #E5E5E5; }
.pill-dark{ background:var(--c-ink); color:var(--c-white); }

/* ---- 중앙: 카피 ---- */
.hero-center{
  align-items:center;
  text-align:center;
  justify-content:center;
  gap:10px;
  padding:0 2px;
  transform:translateY(-2px);
}
.hero-eyebrow{
  font-size:14px;
  font-weight:600;
  color:var(--c-primary);
  letter-spacing:.01em;
}
.hero-eyebrow-img{
  width:clamp(160px,16vw,188px);
  height:auto;
  object-fit:contain;
  display:block;
  margin-bottom:6px;
}
.hero-title{
  margin:6px 0 0;
  font-size:clamp(26px,2.2vw,32px);
  line-height:1.3;
  font-weight:700;
  letter-spacing:-.02em;
  color:var(--c-ink);
}
.hero-sub{
  margin:6px 0 10px;
  font-size:14.5px;
  font-weight:500;
  color:#666666;
  line-height:1.6;
}
.pill-outline{
  display:inline-flex;
  align-items:center;
  height:44px;
  background:var(--c-white);
  color:var(--c-primary);
  border:1.5px solid var(--c-primary);
  font-weight:600;
  font-size:15px;
  padding:0 28px;
}

/* ---- 우측: 분리된 캡슐 2개 세로 배치 ---- */
.hero-right{ gap:18px; align-items:flex-end; }
.capsule-beach,
.capsule-map{
  width:100%;
  max-width:342px;
  height:160px;
  position:relative;
  margin-left:auto;
  overflow:visible;
}
.capsule-beach .asset-img{
  position:absolute;
  left:50%;
  bottom:-12px;
  transform:translateX(-50%);
  width:314px;
  height:auto;
  object-fit:contain;
  z-index:2;
}
.capsule-map .asset-img{
  position:absolute;
  left:50%;
  top:-16px;
  transform:translateX(-50%);
  width:328px;
  height:auto;
  object-fit:contain;
  z-index:2;
}

/* =========================================================
   카테고리 탭
   ========================================================= */
.tabs-wrap{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.98);
  backdrop-filter:blur(14px);
  border-bottom:1px solid #F0F0F0;
}
.tabs{
  max-width:var(--max-width);
  margin:0 auto;
  padding:15px 28px;
  display:flex;
  gap:10px;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  height:44px;
  border:1px solid #E8E8E8;
  background:var(--c-white);
  color:#333333;
  border-radius:var(--radius-pill);
  padding:0 20px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:background .2s ease, color .2s ease, border-color .2s ease;
}
.tab.active{
  background:var(--c-primary);
  color:var(--c-white);
  border-color:var(--c-primary);
}
@media (prefers-reduced-motion:reduce){ .tab{ transition:none } }

/* =========================================================
   본문 / 카드 그리드
   ========================================================= */
.content{
  max-width:var(--max-width);
  margin:0 auto;
  padding:32px 28px 80px;
}
.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin-bottom:20px;
}
.section-head h2{
  margin:0;
  font-size:24px;
  font-weight:700;
  letter-spacing:-.03em;
}
.count{ color:var(--c-gray); font-size:14px; }

.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:var(--gap-card);
}
@media (max-width:1199px) and (min-width:768px){
  .grid{ grid-template-columns:repeat(3,minmax(0,1fr)); }
}
@media (max-width:767px){
  .grid{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
}

.card{
  display:flex;
  flex-direction:column;
  height:100%;
  background:var(--c-white);
  border:1px solid #ECECEC;
  border-radius:var(--radius-card);
  overflow:hidden;
  box-shadow:0 5px 18px rgba(0,0,0,.05);
}
@media (hover:hover){
  .card{ transition:box-shadow .2s ease; }
  .card:hover{ box-shadow:0 10px 26px rgba(0,0,0,.09); }
  .card:hover .photo img{ transform:scale(1.03); }
}
@media (prefers-reduced-motion:reduce){
  .photo img{ transition:none !important; }
}

.photo{
  position:relative;
  aspect-ratio:4/3;
  background:linear-gradient(135deg,var(--c-primary-soft),#DCEFE5);
  overflow:hidden;
}
.photo img{
  width:100%; height:100%;
  object-fit:cover;
  display:block;
  transition:transform .35s ease;
}
.photo img.img-hidden{ display:none; }
.photo .fallback{
  position:absolute; inset:0;
  display:none;
  align-items:center; justify-content:center;
  color:var(--c-primary);
  font-size:11.5px; font-weight:700;
  text-align:center; padding:10px;
}
.photo.no-image .fallback{ display:flex; }

.info{
  position:relative;
  flex:1;
  display:flex;
  flex-direction:column;
  padding:16px 72px 18px 16px;
}
.title{
  margin:0 0 6px;
  font-size:17px;
  font-weight:700;
  letter-spacing:-.02em;
  line-height:1.35;
}
.desc{
  margin:0;
  flex:1;
  font-family:"Pretendard", var(--font-base);
  font-size:13.5px;
  font-weight:500;
  color:#5A5A5A;
  letter-spacing:-.003em;
  line-height:1.55;
  min-height:calc(1.55em * 2);
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  word-break:keep-all;
  overflow-wrap:break-word;
}
.detail-link{
  position:absolute;
  right:14px;
  bottom:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}
.detail-text{
  font-size:10px;
  font-weight:600;
  color:#93A199;
  white-space:nowrap;
}
.detail-circle{
  width:38px; height:38px;
  border-radius:50%;
  background:var(--c-primary-soft);
  color:var(--c-primary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  font-weight:700;
}
.detail-link[aria-disabled="true"] .detail-text{ color:#C3C9C5; }
.detail-link[aria-disabled="true"] .detail-circle{
  background:var(--c-line);
  color:#B6C0BA;
  cursor:not-allowed;
}
@media (hover:hover){
  .detail-circle{ transition:background .2s ease, color .2s ease; }
  .card:hover .detail-circle{ background:var(--c-primary); color:var(--c-white); }
}

.empty{
  display:none;
  padding:80px 20px;
  text-align:center;
  color:var(--c-gray);
  background:var(--c-white);
  border:1px dashed var(--c-line);
  border-radius:var(--radius-card);
}

.page-footer{
  padding:36px 28px 60px;
  text-align:center;
  color:#A2ADA6;
  font-size:11.5px;
}


/* Keyword sticker cluster: compact 3 + 3 rhythm like the approved visual
   (always on — the hero is now a fixed composition that scales as a whole) */
.hero-keywords .pill:nth-child(1){ order:1; }
.hero-keywords .pill:nth-child(2){ order:2; }
.hero-keywords .pill:nth-child(3){ order:3; }
.hero-keywords .pill:nth-child(4){ order:4; margin-left:14px; }
.hero-keywords .pill:nth-child(5){ order:5; }
.hero-keywords .pill:nth-child(6){ order:6; }
.hero-keywords::after{
  content:"";
  flex-basis:100%;
  width:0;
  order:3;
}

/* =========================================================
   HERO responsive stability + visual hierarchy
   ========================================================= */

/* Decorative keyword stickers: visually distinct from functional category tabs */
.hero-keywords{
  gap:6px 7px;
}
.hero-keywords .pill{
  height:27px;
  padding:0 11px;
  font-size:11px;
  font-weight:600;
  border-radius:10px;
  box-shadow:none;
}
.hero-keywords .pill-light{
  border:1px solid #E7E7E7;
  background:#FFF;
}
.hero-keywords .pill-dark{
  border:1px solid #111;
}

/* Functional category tabs: larger rounded controls, clearly separate from stickers */
.tabs{
  gap:12px;
}
.tab{
  min-height:46px;
  height:46px;
  padding:0 22px;
  border-radius:16px;
  font-size:14px;
  font-weight:650;
  border:1px solid #E4E7E5;
  box-shadow:0 2px 8px rgba(17,17,17,.025);
}
.tab.active{
  box-shadow:0 5px 14px rgba(40,201,111,.16);
}

/* Keep transparent PNG artwork fully visible inside its allotted hero area */
.capsule-character .asset-img{
  height:286px;
  bottom:-4px;
}
.capsule-beach .asset-img{
  width:292px;
  bottom:-9px;
}
.capsule-map .asset-img{
  width:304px;
  top:-9px;
}

/* Half-window / narrow desktop: preserve the 3-column composition instead of stacking */
@media (max-width:1023px) and (min-width:721px){
  .tabs{
    padding:13px 20px;
    gap:9px;
  }
  .tab{
    height:42px;
    min-height:42px;
    padding:0 16px;
    border-radius:15px;
    font-size:12.5px;
  }
}

/* True mobile only: intentional vertical composition */
@media (max-width:720px){
  .tabs{
    padding:12px 6px;
    gap:4px;
    justify-content:center;
    overflow-x:visible;
  }
  .tab{
    flex:1 1 auto;
    height:38px;
    min-height:38px;
    padding:0 4px;
    border-radius:12px;
    font-size:clamp(7.5px, 2.45vw, 10.5px);
    letter-spacing:-0.3px;
    justify-content:center;
  }
  .content{ padding:24px 16px 60px; }
  .section-head h2{ font-size:20px; }
  .info{ padding:12px 12px 14px; }
  .title{ font-size:14.5px; }
  .desc{ font-size:11.5px; }
  .detail-link{
    position:static;
    flex-direction:row;
    align-items:center;
    align-self:flex-end;
    margin-top:8px;
    gap:5px;
  }
  .detail-text{ font-size:9px; }
  .detail-circle{ width:30px; height:30px; font-size:14px; }
}

</style>

<style>
/* v3 — fluid-window stability patch
   Keep hero geometry predictable while browser width is freely resized. */
.hero{
  overflow: visible !important;
}
.hero-grid,
.hero-col,
.capsule,
.capsule .asset-img{
  min-width:0;
}
.capsule{
  isolation:isolate;
}

/* Give transparent artwork a real safety zone above the green capsule.
   The PNG itself may extend beyond the capsule, so never clip the hero. */
.capsule-character,
.capsule-beach,
.capsule-map{
  overflow:visible !important;
}
.capsule-beach .asset-img{
  top:auto !important;
  bottom:-6px !important;
  width:min(86%,292px) !important;
  max-height:calc(100% + 48px);
}

/* Cards should change column count only at deliberate breakpoints,
   never distort their internal image/text geometry. */
.grid{align-items:stretch;}
.card{min-width:0;}
.photo{width:100%;}
.photo img{min-width:100%;}

@media (min-width:1000px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));}
}
@media (min-width:680px) and (max-width:999px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));}
}
@media (max-width:679px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));}
}
</style>

</head>
<body>

<div class="hero-scale-outer" id="heroScaleOuter">
<header class="hero" id="heroStage">
  <div class="hero-grid">

    <!-- 좌측: 캐릭터 캡슐 + 키워드 pill -->
    <div class="hero-col hero-left">
      <div class="capsule capsule-character">
        <img class="asset-img" src="assets/hero-character.png" alt="더워하는 여름 캐릭터">
        <img class="hero-sun-deco" src="assets/sun-icon.png" alt="" aria-hidden="true">
      </div>
      <div class="hero-keywords">
        <span class="pill pill-dark">액티비티</span>
        <span class="pill pill-light">파도위에서 놀아볼까?</span>
        <span class="pill pill-light">초록초록 나무냄새</span>
        <span class="pill pill-light">열대야 휴식</span>
        <span class="pill pill-light">이번 여름 제대로 놀아보자!</span>
        <span class="pill pill-dark">시원한 바람 최고!</span>
      </div>
    </div>

    <!-- 중앙: 카피 -->
    <div class="hero-col hero-center">
      <img class="hero-eyebrow-img" src="assets/summer-curation.png" alt="Summer Curation">
      <h1 class="hero-title">이번여름<br>어디로 떠나볼까?</h1>
      <p class="hero-sub">계절에 꼭 어울리는 명소만 엄선했어요.</p>
      <span class="pill pill-outline">100x100 명소발굴</span>
    </div>

    <!-- 우측: 분리된 캡슐 2개 -->
    <div class="hero-col hero-right">
      <div class="capsule capsule-beach">
        <img class="asset-img" src="assets/hero-beach.png" alt="야자수와 비치볼이 있는 여름 바다 일러스트">
      </div>
      <div class="capsule capsule-map">
        <img class="asset-img" src="assets/hero-map.png" alt="접힌 여행지도와 위치 핀 일러스트">
      </div>
    </div>

  </div>
</header>
</div>

<nav class="tabs-wrap" aria-label="여름 명소 카테고리">
  <div class="tabs" id="tabs"></div>
</nav>

<main class="content">
  <div class="section-head">
    <h2 id="sectionTitle"></h2>
    <span class="count" id="count"></span>
  </div>
  <section class="grid" id="grid"></section>
  <div class="empty" id="empty">명소 목록과 이미지를 넣으면 같은 카드 구조로 표시됩니다.</div>
</main>

<div class="page-footer">대한민국구석구석 · SUMMER</div>

<script>

const categories = {
  wave:   { label:"🌊 파도소리", places:[

    { title:"해운대해수욕장",  image:"images/wave_03.jpg", description:"전국 1위 규모, 빌딩·호텔과 어우러진 도심 해변", url:"https://korean.visitkorea.or.kr/detail/ms_detail.do?cotid=36f54304-e9a8-4615-9226-eb749bf6ce75" },

    { title:"협재해수욕장",    image:"images/wave_05.jpg", description:"코발트빛 바다와 울창한 소나무 숲이 어우러진 풍광", url:"https://korean.visitkorea.or.kr/detail/ms_detail.do?cotid=e00d3013-55ef-4c44-b944-571c50bc4b88" },
    { title:"주전몽돌해변",    image:"images/wave_06.jpg", description:"까만 몽돌이 늘어선 해안과 청량한 파도 소리", url:"https://korean.visitkorea.or.kr/detail/ms_detail.do?cotid=9b1ce872-1dcc-4388-a7af-3ab908b177a4" },
    { title:"함덕해수욕장",    image:"images/wave_07.jpg", description:"서우봉 오름이 품은 에메랄드빛 해변", url:"https://korean.visitkorea.or.kr/detail/ms_detail.do?cotid=53eddfdf-086c-410e-893c-20258343ac79" },

const tabs=document.getElementById('tabs');
const grid=document.getElementById('grid');
const title=document.getElementById('sectionTitle');
const count=document.getElementById('count');
const empty=document.getElementById('empty');

function renderTabs(active){
  tabs.innerHTML='';
  Object.entries(categories).forEach(([key,cat])=>{
    const b=document.createElement('button');
    b.className='tab'+(key===active?' active':'');
    b.textContent=cat.label;
    b.setAttribute('aria-pressed', key===active ? 'true' : 'false');
    b.onclick=()=>{ history.replaceState(null,'',`?category=${key}`); render(key); };
    tabs.appendChild(b);
  });
}

function cardHtml(p){
  const hasUrl = !!p.url;
  const linkAttrs = hasUrl
    ? `href="${p.url}" target="_blank" rel="noopener noreferrer"`
    : `href="javascript:void(0)" aria-disabled="true" tabindex="-1"`;
  return `
    <article class="card">
      <div class="photo" data-fallback>
        <img src="${p.image}" alt="${p.title}" loading="lazy"
             onerror="this.classList.add('img-hidden'); this.parentElement.classList.add('no-image');">
        <div class="fallback">${p.title}</div>
      </div>
      <div class="info">
        <h3 class="title">${p.title}</h3>
        <p class="desc">${p.description || ''}</p>
        <a class="detail-link" ${linkAttrs} aria-label="${p.title} 상세 페이지 보기">
          <span class="detail-text">자세히 보기</span>
          <span class="detail-circle" aria-hidden="true">→</span>
        </a>
      </div>
    </article>`;
}

function render(key){
  const cat = categories[key] || categories.valley;
  renderTabs(key);
  title.textContent = cat.label.replace(/^\S+\s/, '');
  count.textContent = `${cat.places.length}곳`;
  grid.innerHTML = cat.places.map(cardHtml).join('');
  empty.style.display = cat.places.length ? 'none' : 'block';
}

const initial = new URLSearchParams(location.search).get('category') || 'valley';
render(initial);

/* Hero scale-to-fit: the hero is authored once at its full desktop size
   (see #heroStage / .hero, width:1240px) and is never reflowed or restacked.
   As the window is resized, we scale that fixed composition down as a single
   image-like unit so nothing rearranges, gets cut off, or overlaps. */
(function heroScaleToFit(){
  const outer = document.getElementById('heroScaleOuter');
  const stage = document.getElementById('heroStage');
  if (!outer || !stage) return;

  let rafId = null;

  function apply(){
    stage.style.transform = 'none';
    const naturalWidth = stage.offsetWidth;
    const naturalHeight = stage.offsetHeight;
    const availableWidth = outer.clientWidth;
    const scale = Math.min(1, availableWidth / naturalWidth);
    stage.style.transformOrigin = 'top center';
    stage.style.transform = `scale(${scale})`;
    outer.style.height = (naturalHeight * scale) + 'px';
  }

  function scheduleApply(){
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(apply);
  }

  scheduleApply();
  window.addEventListener('resize', scheduleApply);
  window.addEventListener('load', scheduleApply);
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(scheduleApply);
  }
})();
</script>
